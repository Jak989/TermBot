services:
  termbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: termbot
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      BOT_CWD: /app
      BOT_SHELL: /bin/bash
      BOT_WEB_HOST: 0.0.0.0
      BOT_WEB_PORT: 8787
      BOT_CODEX_BACKEND: tmux
      BOT_TMUX_BIN: tmux
      CODEX_HOME: /root/.codex
      NODE_ENV: production
      TZ: Europe/Berlin
    volumes:
      - ./data:/app/data
      # Keep Codex auth/profile persistent across container restarts.
      - codex_home:/root/.codex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/telegram-miniapp/index.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  codex_home:
